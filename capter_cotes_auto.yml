name: Capture Cotes

on:
  schedule:
    - cron: '0 * * * *'  # Exécute toutes les heures
  workflow_dispatch:     # Permet de lancer manuellement

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager pandas beautifulsoup4 pytz

      - name: Run script
        run: python capter_cotes_auto.py

      - name: Upload HTML de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit et push des résultats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historique_cotes/*.csv
          git diff --cached --quiet && echo "Aucun changement à committer" || git commit -m "Mise à jour des cotes ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push
